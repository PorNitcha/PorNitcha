<text x='96' y='644' font-family='Arial, Helvetica, sans-serif' font-size='13' fill='#14213d'>Read: on the 2026 base every Indonesian account that has history sits in "Fix price before volume" (22% of the 2027 plan volume for 13% of its GP) — none is in Grow or Protect.</text>
<text x='96' y='666' font-family='Arial, Helvetica, sans-serif' font-size='12.5' fill='#14213d'>Role for Indonesia = fill otherwise-idle capacity at a floor price. That means a volume cap on the fix-price book (no growth until price is fixed), not a growth target; growth tonnes belong to the Grow quadrant (27% of volume, 59% of GP).</text>
