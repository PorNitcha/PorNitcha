<text x='50' y='68' font-family='Arial, Helvetica, sans-serif' font-size='12.5' fill='#6b7280'>Share of the 2027 plan · volume = 2027 plan tonnes · GP = 2027 plan tonnes × base-year product GP/t · floor 4,700 THB/t product GP · accounts with a 2027 plan ≥ 100 t</text>
<text x='50' y='86' font-family='Arial, Helvetica, sans-serif' font-size='12.5' fill='#6b7280'>Indonesia = direct export accounts + PT Thai Wah Indonesia (intercompany) · same data and quadrant rules as the customer quadrant page (HVA AP 2027)</text>
<text x='50' y='104' font-family='Arial, Helvetica, sans-serif' font-size='12.5' fill='#6b7280'>GP/kg = base-year product GP in THB/kg at TDC level · TWIN (interco) also shown as TDC + TWIN's own trading margin on the same products = combined chain GP/kg</text>
